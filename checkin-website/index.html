<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <!-- Only this site's own files may load, and the page may only talk to Supabase. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src https://*.supabase.co; base-uri 'none'; form-action 'none'">
  <title>The Furnace Check-In</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
  <!-- Fetch all the scripts at once instead of one after another. -->
  <link rel="modulepreload" href="supabase.js">
  <link rel="modulepreload" href="config.js">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header>
    <img class="logo" src="logo.png" alt="The Furnace Teen Center" width="192" height="123">
    <button id="sign-out" class="pill light" type="button" hidden>Sign out</button>
  </header>

  <main>
    <section id="loading" class="hero">
      <div class="spinner" role="status" aria-label="Loading"></div>
    </section>

    <section id="setup" class="hero" hidden>
      <h1>Almost ready</h1>
      <p class="lead">Add your Supabase details to <code>config.js</code>. The README explains how.</p>
    </section>

    <section id="signed-out" class="hero" hidden>
      <p class="eyebrow">The Furnace Teen Center</p>
      <h1>Check in for today</h1>
      <p class="lead">Sign in once, then it's one tap every time you come in.</p>
      <button id="sign-in" class="pill dark big" type="button">
        <svg class="google" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.2l7.8 6.1C12.3 13.6 17.7 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 2.9-2.2 5.4-4.7 7.1l7.6 5.9c4.4-4.1 6.9-10.1 6.9-17.5z"/>
          <path fill="#FBBC05" d="M10.4 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6.1C1 16.5 0 20.1 0 24s1 7.5 2.6 10.8l7.8-6.1z"/>
          <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.7-4.1-13.6-9.8l-7.8 6.1C6.6 42.6 14.6 48 24 48z"/>
        </svg>
        Sign in with Google
      </button>
    </section>

    <section id="signed-in" class="hero" hidden>
      <p class="eyebrow">Hi, <span id="name"></span></p>
      <h1 id="today"></h1>
      <button id="check-in" class="pill accent big" type="button">I'm here today</button>
      <p id="checked-in" class="done" role="status" hidden></p>
      <p id="this-month" class="muted"></p>
    </section>

    <section id="coordinator" hidden>
      <h2>Monthly report</h2>
      <div id="months" class="pills"></div>
      <div id="report-area" hidden>
        <p id="report-total" class="muted"></p>
        <ul id="report" class="people"></ul>
        <button id="download" class="pill dark" type="button">Download spreadsheet</button>
      </div>
    </section>

    <p id="problem" role="alert" hidden></p>
  </main>
</body>
</html>
